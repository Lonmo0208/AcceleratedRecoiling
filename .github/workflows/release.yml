name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'mod_version to build (also used as the release tag). Leave empty to read gradle.properties.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          from_properties=$(grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$from_properties" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
          else
            version="$from_properties"
            tag="v$version"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          # CurseForge and Modrinth both key off the Minecraft version label.
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$mc_version" ]; then
            echo "minecraft_version not found in gradle.properties" >&2
            exit 1
          fi
          echo "mc_version=$mc_version" >> "$GITHUB_OUTPUT"

          # alpha/beta come from the tag or version name, e.g. v21.8.18-alpha.
          # Anything else is a release, rather than silently shipping as alpha.
          lowered=$(echo "$version" | tr '[:upper:]' '[:lower:]')
          if [[ "$lowered" == *alpha* ]]; then
            release_type=alpha
          elif [[ "$lowered" == *beta* ]]; then
            release_type=beta
          else
            release_type=release
          fi
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

          echo "version = $version (gradle.properties: $from_properties)"
          echo "tag     = $tag"
          echo "mc      = $mc_version"
          echo "type    = $release_type"

      - name: Check native toolchain release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          toolchain=$(grep -E '^cpp_toolchain_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          echo "cpp_toolchain_version = $toolchain"

          if ! gh release view "$toolchain" --repo wiyuka-owo/AcceleratedRecoiling > /dev/null; then
            echo "Native toolchain release '$toolchain' not found in wiyuka-owo/AcceleratedRecoiling." >&2
            echo "Publish it before releasing." >&2
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          # GitHub runs bash with -e -o pipefail, so `gradlew | tee` would abort the
          # step at the first failure and lose the rest of the log. Capture the full
          # output to a file, surface the tail, then propagate the real exit status.
          cmd //c "gradlew.bat clean jar -Pmod_version=${{ steps.version.outputs.version }} -Porg.gradle.jvmargs=-Xmx4G --no-daemon --stacktrace" > /tmp/ar-build.log 2>&1
          status=$?
          tail -n 120 /tmp/ar-build.log || true
          echo "gradle exit status: $status"
          exit "$status"

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail

          # nullglob so an unmatched glob expands to nothing instead of the literal pattern
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No jar produced" >&2
            exit 1
          fi
          jar="${jars[0]}"
          echo "Artifact: $jar ($(du -h "$jar" | cut -f1))"

          listing=$(unzip -l "$jar")
          natives=$(echo "$listing" | grep 'natives/' || true)
          if [ -z "$natives" ]; then
            echo "Jar contains no natives/, native build did not run" >&2
            exit 1
          fi
          echo "$natives"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: acceleratedrecoiling-26.2
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No jar produced" >&2
            exit 1
          fi
          jar="${jars[0]}"
          echo "Releasing $TAG from $GITHUB_SHA (mod_version=$VERSION)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, uploading asset"
            gh release upload "$TAG" "$jar" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "$jar" --title "$TAG" --notes "Built from $GITHUB_SHA with mod_version=$VERSION."
          fi

      - name: Publish to CurseForge and Modrinth
        # Tag pushes only, so a manual run can never publish a version by accident.
        # mc-publish handles both platforms and cross-posts them as one version.
        if: startsWith(github.ref, 'refs/tags/')
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          files: build/libs/!(*-sources|*-javadoc).jar

          name: AcceleratedRecoiling ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: ${{ steps.version.outputs.release_type }}
          loaders: neoforge
          game-versions: |
            ${{ steps.version.outputs.mc_version }}

          curseforge-id: '1374622'
          modrinth-id: 'mMXtqi5e'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
