name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'mod_version to build (also used as the release tag). Leave empty to read gradle.properties.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          from_properties=$(grep -E '^mod_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$from_properties" ]; then
            echo "mod_version not found in gradle.properties" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
            tag="v$version"
          else
            version="$from_properties"
            tag="v$version"
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

          # CurseForge and Modrinth both key off the Minecraft version label.
          mc_version=$(grep -E '^minecraft_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$mc_version" ]; then
            echo "minecraft_version not found in gradle.properties" >&2
            exit 1
          fi
          echo "mc_version=$mc_version" >> "$GITHUB_OUTPUT"

          # alpha/beta come from the tag or version name, e.g. v21.8.18-alpha.
          # Anything else is a release, rather than silently shipping as alpha.
          lowered=$(echo "$version" | tr '[:upper:]' '[:lower:]')
          if [[ "$lowered" == *alpha* ]]; then
            release_type=alpha
          elif [[ "$lowered" == *beta* ]]; then
            release_type=beta
          else
            release_type=release
          fi
          echo "release_type=$release_type" >> "$GITHUB_OUTPUT"

          echo "version = $version (gradle.properties: $from_properties)"
          echo "tag     = $tag"
          echo "mc      = $mc_version"
          echo "type    = $release_type"

      - name: Check native toolchain release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          toolchain=$(grep -E '^cpp_toolchain_version=' gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
          echo "cpp_toolchain_version = $toolchain"

          if ! gh release view "$toolchain" --repo wiyuka-owo/AcceleratedRecoiling > /dev/null; then
            echo "Native toolchain release '$toolchain' not found in wiyuka-owo/AcceleratedRecoiling." >&2
            echo "Publish it before releasing." >&2
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          # GitHub runs bash with -e -o pipefail, so `gradlew | tee` would abort the
          # step at the first failure and lose the rest of the log. Capture the full
          # output to a file, surface the tail, then propagate the real exit status.
          # --continue lets Gradle keep going where it can, so more of the intermediate
          # artifacts exist for the diagnose step that follows.
          cmd //c "gradlew.bat clean jar -Pmod_version=${{ steps.version.outputs.version }} -Porg.gradle.jvmargs=-Xmx4G --no-daemon --stacktrace --continue --info" > /tmp/ar-build.log 2>&1
          status=$?
          tail -n 120 /tmp/ar-build.log || true
          echo "gradle exit status: $status"
          exit "$status"

      - name: Diagnose LivingEntity.doPush visibility
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Must run AFTER the build (the artifacts do not exist before it) and also
          # when the build failed. Purely diagnostic: every command is guarded and the
          # step ends with `exit 0`, so it can never mask the real build outcome.
          set -uo pipefail

          echo "===== javac diagnostics from the build log ====="
          if [ -f /tmp/ar-build.log ]; then
            grep -nE 'error:|\.java:[0-9]+:|has protected access|cannot find symbol' /tmp/ar-build.log | head -n 60 || true
            grep -nE 'items on the compile classpath' /tmp/ar-build.log | head -n 5 || true
          else
            echo "    no build log captured"
          fi

          echo "===== did createMinecraftArtifacts actually succeed? ====="
          grep -nE 'Task :createMinecraftArtifacts|Completed recompile|Completed sourcesAndCompiledWithNeoForge|Task :compileJava' /tmp/ar-build.log 2>/dev/null | head -n 20 || true
          grep -nE 'FAILED|What went wrong|Execution failed' /tmp/ar-build.log 2>/dev/null | head -n 10 || true

          echo "===== the access transformer file that NeoForm is handed ====="
          for at in build/generated/sources/modMetadata/META-INF/accesstransformer.cfg \
                    src/main/resources/META-INF/accesstransformer.cfg \
                    src/main/resources/accesstransformer.cfg \
                    src/main/templates/META-INF/accesstransformer.cfg; do
            if [ -f "$at" ]; then
              echo "--- EXISTS: $at"
              grep -n 'LivingEntity' "$at" || echo "    (no LivingEntity entry!)"
            else
              echo "--- MISSING: $at"
            fi
          done

          echo "===== --access-transformer argument NeoForm was invoked with ====="
          transformer_hit=$(grep -o -- '--access-transformer [^ ]*' /tmp/ar-build.log 2>/dev/null | head -n 5 || echo "none found")
          echo "$transformer_hit"

          echo "===== jars present after the build ====="
          shopt -s nullglob
          for jar in build/moddev/artifacts/*.jar build/libs/*.jar; do
            echo "  $jar"
          done

          echo "===== where LivingEntity.doPush is visible from ====="
          find build/moddev "$HOME/.gradle/caches" -name '*.jar' 2>/dev/null | head -n 4000 > /tmp/ar-jars.txt || true
          total=$(wc -l < /tmp/ar-jars.txt || echo 0)
          echo "jars to scan: $total"
          pattern='net.minecraft.world.entity.LivingEntity'
          hits=0
          while read -r jar; do
            if [ "$hits" -ge 10 ]; then
              break
            fi
            if javap -p -classpath "$jar" "$pattern" 2>&1 | grep -E 'doPush|abstract class' > /tmp/ar-hit.txt; then
              echo "--- $jar"
              cat /tmp/ar-hit.txt || true
              hits=$((hits + 1))
            fi
          done < /tmp/ar-jars.txt || true
          echo "jars exposing LivingEntity.doPush: $hits"

          echo "===== access transformer shipped in the produced jar ====="
          for jar in build/libs/*.jar; do
            echo "--- $jar"
            unzip -p "$jar" accesstransformer.cfg 2>/dev/null || echo "    (nothing at jar root)"
            unzip -p "$jar" META-INF/accesstransformer.cfg 2>/dev/null || echo "    (nothing under META-INF/)"
          done || true

          echo "===== last 60 lines of the build log ====="
          tail -n 60 /tmp/ar-build.log 2>/dev/null || echo "    (none)"

          # GitHub runs bash with -e; force a successful status so this purely
          # diagnostic step can never mask or replace the real build outcome.
          exit 0

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail

          # nullglob so an unmatched glob expands to nothing instead of the literal pattern
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No jar produced" >&2
            exit 1
          fi
          jar="${jars[0]}"
          echo "Artifact: $jar ($(du -h "$jar" | cut -f1))"

          listing=$(unzip -l "$jar")
          natives=$(echo "$listing" | grep 'natives/' || true)
          if [ -z "$natives" ]; then
            echo "Jar contains no natives/, native build did not run" >&2
            exit 1
          fi
          echo "$natives"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: acceleratedrecoiling
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No jar produced" >&2
            exit 1
          fi
          jar="${jars[0]}"
          echo "Releasing $TAG from $GITHUB_SHA (mod_version=$VERSION)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists, uploading asset"
            gh release upload "$TAG" "$jar" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "$jar" --title "$TAG" --notes "Built from $GITHUB_SHA with mod_version=$VERSION."
          fi

      - name: Publish to CurseForge and Modrinth
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/publish-platforms
        with:
          version: ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.tag }}
          minecraft-version: ${{ steps.version.outputs.mc_version }}
          release-type: ${{ steps.version.outputs.release_type }}
          loaders: '["neoforge"]'
          curseforge-project-id: '1374622'
          modrinth-project-id: 'mMXtqi5e'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
