name: Publish to CurseForge and Modrinth
description: >
  Uploads an already-built jar to CurseForge and Modrinth. Both platforms are
  attempted independently, so one failing does not skip the other; the action
  exits non-zero if either failed.

inputs:
  version:
    description: Bare version string, e.g. 21.8.19
    required: true
  tag:
    description: Release tag, e.g. v21.8.19
    required: true
  minecraft-version:
    description: Minecraft version label sent to both APIs, e.g. 1.21.8
    required: true
  loaders:
    description: JSON array of loader names
    required: false
    default: '["neoforge"]'
  release-type:
    description: One of release, beta, alpha
    required: false
    default: release
  curseforge-project-id:
    description: Numeric CurseForge project id
    required: true
  modrinth-project-id:
    description: Modrinth project id or slug
    required: true
  curseforge-token:
    description: CurseForge API token
    required: true
  modrinth-token:
    description: Modrinth personal access token
    required: true

runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      env:
        AR_VERSION: ${{ inputs.version }}
        AR_TAG: ${{ inputs.tag }}
        AR_MC_VERSION: ${{ inputs.minecraft-version }}
        AR_LOADERS: ${{ inputs.loaders }}
        AR_RELEASE_TYPE: ${{ inputs.release-type }}
        AR_CF_PROJECT: ${{ inputs.curseforge-project-id }}
        AR_MR_PROJECT: ${{ inputs.modrinth-project-id }}
        AR_CF_TOKEN: ${{ inputs.curseforge-token }}
        AR_MR_TOKEN: ${{ inputs.modrinth-token }}
      run: |
        # Go through every platform even if one fails, so a token hiccup on one
        # site does not skip the other. `set -e` is deliberately not used here.
        shopt -s nullglob
        jars=(build/libs/*.jar)
        if [ ${#jars[@]} -eq 0 ]; then
          echo "No jar found in build/libs" >&2
          exit 1
        fi
        jar="${jars[0]}"
        echo "Uploading $jar as version $AR_VERSION (mc $AR_MC_VERSION, type $AR_RELEASE_TYPE)"

        status=0

        echo "===== CurseForge (project $AR_CF_PROJECT) ====="
        http=$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
          -X POST "https://minecraft.curseforge.com/api/projects/${AR_CF_PROJECT}/upload-file" \
          -H "X-Api-Token: ${AR_CF_TOKEN}" \
          -F "metadata={\"changelog\":\"See the GitHub release notes.\",\"changelogType\":\"markdown\",\"displayName\":\"AcceleratedRecoiling ${AR_VERSION}\",\"releaseType\":\"${AR_RELEASE_TYPE}\",\"gameVersions\":[\"${AR_MC_VERSION}\",\"NeoForge\"],\"relations\":{\"projects\":[]}};type=application/json" \
          -F "file=@${jar}") || true
        if [ "$http" = "200" ]; then
          echo "CurseForge OK: $(cat /tmp/cf.json || true)"
        else
          echo "CurseForge FAILED (http $http)" >&2
          cat /tmp/cf.json 2>/dev/null >&2 || true
          status=1
        fi

        echo "===== Modrinth (project $AR_MR_PROJECT) ====="
        http=$(curl -sS -o /tmp/mr.json -w '%{http_code}' \
          -X POST "https://api.modrinth.com/v2/version" \
          -H "Authorization: ${AR_MR_TOKEN}" \
          -F "data={\"name\":\"AcceleratedRecoiling ${AR_VERSION}\",\"version_number\":\"${AR_VERSION}\",\"changelog\":\"See the GitHub release notes.\",\"dependencies\":[],\"game_versions\":[\"${AR_MC_VERSION}\"],\"version_type\":\"${AR_RELEASE_TYPE}\",\"loaders\":${AR_LOADERS},\"featured\":false,\"project_id\":\"${AR_MR_PROJECT}\"};type=application/json" \
          -F "file=@${jar}") || true
        if [ "$http" = "200" ]; then
          echo "Modrinth OK: $(cat /tmp/mr.json || true)"
        else
          echo "Modrinth FAILED (http $http)" >&2
          cat /tmp/mr.json 2>/dev/null >&2 || true
          status=1
        fi

        exit "$status"
